# ============================================================================
# Assistant Agent - Full Configuration Reference
# ============================================================================
# This file documents ALL available configuration options.
# Copy sections you need to application.yml and customize them.
# ============================================================================

spring:
  application:
    name: assistant-agent-app

server:
  port: 8080

# ============================================================================
# Unified Chat Bridge
# ============================================================================
assistant:
  chat:
    default-app-name: grayscale_agent
  debug:
    http:
      enabled: false                  # 开启后打印 HTTP 请求/响应调试日志
      only-dashscope: true            # true: 仅打印 DashScope 请求
      max-body-chars: 4000            # 请求体最大打印长度
      sanitize-invalid-tool-messages: true  # 发送前清理明显非法的空工具消息
  # Runtime namespace (new orchestration controls)
  # Note: In migration stage, legacy spring.ai.alibaba.codeact.extension.* keys may override these values.
  runtime:
    fast-intent:
      enabled: false
    prompt:
      dynamic-enabled: true
      react-enabled: true
      codeact-enabled: true
      max-tools-in-prompt: 20
    learning:
      enabled: true
      async: true
    search:
      enabled: true
    policy-guard:
      enabled: true
    budget:
      max-latency-ms: 12000
      max-tool-calls: 6

# ============================================================================
# DashScope Configuration (Required)
# ============================================================================
spring.ai.dashscope:
  api-key: ${DASHSCOPE_API_KEY:sk-8ae125796fc6476cb1062e2eabe5b43a}
  chat:
    options:
      model: qwen3.5-plus          # Options: qwen3.5-plus, qwen-max, qwen-plus, qwen-turbo
      multi-model: true            # qwen3.5-plus 需开启，走 multimodal-generation endpoint
      incremental-output: true     # qwen3.5-plus 需开启，否则会报 only supports incremental_output=true
      # temperature: 0.7
      # top-p: 0.8

# ============================================================================
# Experience Module
# Default: enabled with in-memory storage
# ============================================================================
spring.ai.alibaba.codeact.extension.experience:
  enabled: true                       # Master switch
  code-experience-enabled: true       # Code generation experiences
  react-experience-enabled: true      # ReAct pattern experiences
  common-experience-enabled: true     # Common sense experiences

  # FastIntent - Quick response without full agent execution
  fast-intent-enabled: false          # Default: disabled
  fast-intent-react-enabled: true
  fast-intent-code-enabled: true
  fast-intent-allowed-tools: []       # Empty = no restriction

  # Query limits
  max-items-per-query: 5
  max-content-length: 2000

  # Storage: In-memory (default)
  in-memory:
    enabled: true
    max-total-experiences: 1000
    ttl-seconds: -1                   # -1 = never expire

  # Storage: Store-based (optional, for persistence)
  store:
    enabled: false
    namespace-prefix: experience

  logging:
    enabled: true

# ============================================================================
# Learning Module
# Default: enabled with after-agent learning
# ============================================================================
spring.ai.alibaba.codeact.extension.learning:
  enabled: true                       # Master switch

  online:
    enabled: true
    after-agent:                      # Learn after agent execution
      enabled: true
      learning-types:
        - experience
    after-model:                      # Learn after each model call
      enabled: false
    tool-interceptor:                 # Learn from tool executions
      enabled: false
      included-tools: []

  offline:
    enabled: false
    tasks: []

  async:
    enabled: true
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 100

# ============================================================================
# Search Module
# Default: enabled with project and knowledge search
# ============================================================================
spring.ai.alibaba.codeact.extension.search:
  enabled: true
  project-search-enabled: true
  knowledge-search-enabled: true
  web-search-enabled: false           # Requires API key
  default-top-k: 10
  search-timeout-ms: 5000

# ============================================================================
# Reply Module
# Default: enabled with basic send_message tool
# ============================================================================
spring.ai.alibaba.codeact.extension.reply:
  enabled: true
  allow-config-override: true
  tools:
    - toolName: send_message
      channelCode: DEFAULT
      description: Send a message to the user
      reactEnabled: true
      codeActEnabled: true
      parameters:
        - name: text
          type: STRING
          required: true
          description: The message text

# ============================================================================
# Evaluation Module
# Default: enabled with input routing
# ============================================================================
spring.ai.alibaba.codeact.extension.evaluation:
  enabled: true
  async: false
  timeout-ms: 5000

  input-routing:
    enabled: true
    suite-id: react-phase-suite
  model-output:
    enabled: false
    suite-id: model_output_quality_suite
  code-generation-input:
    enabled: false
    suite-id: codeact-phase-suite
  code-execution:
    enabled: false
    suite-id: code_execution_suite
  session-summary:
    enabled: false
    suite-id: session_summary_suite

# ============================================================================
# Trigger Module
# Default: enabled
# ============================================================================
spring.ai.alibaba.codeact.extension.trigger:
  enabled: true
  scheduler:
    pool-size: 2
  execution:
    timeout-seconds: 300

# ============================================================================
# MCP Client (Optional)
# ============================================================================
spring.ai.mcp.client:
  enabled: false
  name: assistant-agent-mcp
  version: 1.0.0
  type: SYNC
  request-timeout: 30s
  toolcallback:
    enabled: true
  # stdio:
  #   servers-configuration: classpath:mcp-servers.json

# ============================================================================
# Logging
# ============================================================================
logging:
  level:
    com.alibaba.assistant.agent: INFO
    # com.alibaba.assistant.agent: DEBUG
    # org.springframework.ai: DEBUG

