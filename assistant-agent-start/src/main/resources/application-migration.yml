# ============================================================================
# Migration Profile - Enterprise Assistant Platform Configuration
# Launch: --spring.profiles.active=migration
# ============================================================================
# Only overrides relative to application.yml are listed here.
# ============================================================================
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:8.156.74.119}:${MYSQL_PORT:3306}/${MYSQL_DB:assistant}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:StrongRootPwd}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    placeholder-replacement: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# Migration bootstrap and system profile mapping
assistant:
  chat:
    default-app-name: assistant_agent
    default-assistant-uid: ${ASSISTANT_DEFAULT_UID:1}
    default-system-code: ${ASSISTANT_DEFAULT_SYSTEM_CODE:gougu_oa}
  debug:
    http:
      enabled: true
      only-dashscope: true
      max-body-chars: 4000
      sanitize-invalid-tool-messages: true
  migration:
    bootstrap:
      legacy-capability:
        enabled: ${ASSISTANT_LEGACY_BOOTSTRAP_ENABLED:true}
  system-default:
    token-header-name: Authorization
    token-header-prefix: 'Bearer '
  system-profiles:
    gougu_oa:
      base-url: ${GOUGU_OA_BASE_URL:http://office.ai.devefive.com}
      token-header-name: Authorization
      token-header-prefix: 'Bearer '
  # Runtime namespace (new): read by AssistantRuntimeProperties
  # Migration compatibility: legacy spring.ai.alibaba.codeact.extension.* keys still take precedence.
  runtime:
    fast-intent:
      enabled: false
    prompt:
      dynamic-enabled: true
      react-enabled: true
      codeact-enabled: true
      max-tools-in-prompt: 20
    learning:
      enabled: true
      async: true
    search:
      enabled: true
    policy-guard:
      enabled: true
    budget:
      max-latency-ms: 12000
      max-tool-calls: 6

# ============================================================================
# DashScope Configuration (override model only, api-key inherited)
# ============================================================================
spring.ai.dashscope:
  chat:
    options:
      model: qwen-plus


# ============================================================================
# Experience Module (overrides relative to application.yml)
# ============================================================================
spring.ai.alibaba.codeact.extension.experience:
  code-experience-enabled: true
  react-experience-enabled: true
  common-experience-enabled: true
  fast-intent-enabled: false
  fast-intent-allowed-tools: []
  max-items-per-query: 5
  max-content-length: 2000
  in-memory:
    enabled: true
    max-total-experiences: 1000
    ttl-seconds: -1
  store:
    enabled: false
    namespace-prefix: experience

# ============================================================================
# Learning Module (additional config beyond application.yml)
# ============================================================================
spring.ai.alibaba.codeact.extension.learning:
  online:
    after-model:
      enabled: false
    tool-interceptor:
      enabled: false
      included-tools: []
  offline:
    enabled: false
    tasks: []
  async:
    enabled: true
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 100

# ============================================================================
# Search Module
# ============================================================================
spring.ai.alibaba.codeact.extension.search:
  enabled: true
  project-search-enabled: true
  knowledge-search-enabled: true
  web-search-enabled: false
  default-top-k: 10
  search-timeout-ms: 5000

# ============================================================================
# Reply Module (different tool set from application.yml)
# ============================================================================
spring.ai.alibaba.codeact.extension.reply:
  allow-config-override: true
  tools:
    - toolName: send_message
      channelCode: IDE_TEXT
      description: Send a message to the user
      reactEnabled: true
      codeActEnabled: true
      parameters:
        - name: text
          type: STRING
          required: true
          description: The message text

# ============================================================================
# Evaluation Module (overrides relative to application.yml)
# ============================================================================
spring.ai.alibaba.codeact.extension.evaluation:
  async: false
  timeout-ms: 5000
  code-generation-input:
    enabled: false
  model-output:
    enabled: false
    suite-id: model_output_quality_suite
  code-execution:
    enabled: false
    suite-id: code_execution_suite
  session-summary:
    enabled: false
    suite-id: session_summary_suite

# ============================================================================
# Trigger Module
# ============================================================================
spring.ai.alibaba.codeact.extension.trigger:
  scheduler:
    pool-size: 2
  execution:
    timeout-seconds: 300

# ============================================================================
# MCP Client
# ============================================================================
spring.ai.mcp.client:
  enabled: false
  name: assistant-agent-mcp
  version: 1.0.0
  type: SYNC
  request-timeout: 30s
  toolcallback:
    enabled: true

# ============================================================================
# Logging (INFO for enterprise, overrides DEBUG in application.yml)
# ============================================================================
logging:
  level:
    com.alibaba.assistant.agent: INFO
