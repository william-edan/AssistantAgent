# ============================================================================
# Assistant Agent - Full Example Configuration
# ============================================================================
# This configuration demonstrates all available options with customizations.
# ============================================================================

spring:
  profiles:
    active: migration
  application:
    name: assistant-agent-full
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration

server:
  port: 8081

assistant:
  chat:
    default-app-name: grayscale_agent
    default-assistant-uid: ${ASSISTANT_CHAT_DEFAULT_ASSISTANT_UID:}
    default-system-code: ${ASSISTANT_CHAT_DEFAULT_SYSTEM_CODE:}
    default-space-code: ${ASSISTANT_CHAT_DEFAULT_SPACE_CODE:}
    default-space-environment: ${ASSISTANT_CHAT_DEFAULT_SPACE_ENVIRONMENT:prod}
  debug:
    http:
      enabled: true
      only-dashscope: true
      max-body-chars: 4000
      sanitize-invalid-tool-messages: true

# ============================================================================
# DashScope Configuration
# ============================================================================
spring.ai.dashscope:
  # 生产环境必须通过环境变量注入密钥，避免将密钥写入仓库。
  api-key: sk-b04898a0b0314937a92ea9d2a91b22be
  chat:
    options:
      model: qwen-plus


# ============================================================================
# Experience Module - with FastIntent enabled
# ============================================================================
spring.ai.alibaba.codeact.extension.experience:
  enabled: true
  fast-intent-enabled: true
  fast-intent-react-enabled: true
  fast-intent-code-enabled: true
  fast-intent-allowed-tools:
    - send_success_message
    - send_error_message
    - send_notification
    - write_code
    - write_condition_code
  logging:
    enabled: true

# ============================================================================
# Learning Module - with after-agent learning
# ============================================================================
spring.ai.alibaba.codeact.extension.learning:
  enabled: true
  online:
    enabled: true
    after-agent:
      enabled: true
      learning-types:
        - experience

# ============================================================================
# Reply Module - with custom tools
# ============================================================================
spring.ai.alibaba.codeact.extension.reply:
  enabled: true
  tools:
    - toolName: send_success_message
      channelCode: IDE_TEXT
      description: Send a success message to the IDE console
      reactEnabled: true
      codeActEnabled: true
      parameters:
        - name: text
          type: STRING
          required: true
          description: The success message text
    - toolName: send_error_message
      channelCode: IDE_TEXT
      description: Send an error message to the IDE console
      reactEnabled: true
      codeActEnabled: true
      parameters:
        - name: text
          type: STRING
          required: true
          description: The error message text
    - toolName: send_notification
      channelCode: IDE_TEXT
      description: Send a notification message
      reactEnabled: true
      codeActEnabled: true
      parameters:
        - name: text
          type: STRING
          required: true
          description: The notification text

# ============================================================================
# Evaluation Module - with input routing
# ============================================================================
spring.ai.alibaba.codeact.extension.evaluation:
  enabled: true
  input-routing:
    enabled: true
    suite-id: react-phase-suite
  code-generation-input:
    enabled: true
    suite-id: codeact-phase-suite

# ============================================================================
# Prompt Contributor Module - 启用基于评估的 Prompt 贡献
# ============================================================================
spring.ai.alibaba.codeact.extension.prompt:
  enabled: true
  react:
    enabled: true
  codeact:
    enabled: true

# ============================================================================
# Logging - Debug level for development
# ============================================================================
logging:
  level:
    com.alibaba.assistant.agent: DEBUG

---
spring:
  config:
    activate:
      on-profile: migration
  autoconfigure:
    exclude: []

